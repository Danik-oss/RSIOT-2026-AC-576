---
# Default values for monitoring-app
# Параметры для варианта 23

# Реплики приложения
replicaCount: 2

# Образ приложения
image:
  repository: monitoring-app
  pullPolicy: IfNotPresent
  tag: "latest"

# Namespace
namespace: monitoring-app

# Метаданные студента
student:
  id: "220250"
  fullname: "Черешко Даниил Николаевич"
  group: "АС-576"
  variant: "23"
  course: "RSIOT"
  owner: "Danik-oss"
  slug: "as-576-220250-v23"

# Метрики
metrics:
  enabled: true
  prefix: "web23_"  # Префикс метрик для варианта 23
  port: 8080
  path: /metrics
  
  # SLO для варианта 23
  slo:
    availability: 99.6  # 99.6%
    latencyP95: 0.22      # 220ms
    errorRate5xx: 1      # 1% за 5 минут

# Service
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: { }
  labels:
    app: monitoring-app
    monitoring: "true"

# Ingress
ingress:
  enabled: false
  className: nginx
  annotations: { }
  hosts:
    - host: monitoring-app.local
      paths:
        - path: /
          pathType: Prefix
  tls: [ ]

# Ресурсы
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Probes
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ServiceMonitor для Prometheus
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: monitoring  # Важно для kube-prometheus-stack

# PrometheusRule - алерты
prometheusRule:
  enabled: true
  labels:
    release: monitoring  # Важно для kube-prometheus-stack
  groups:
    - name: monitoring-app-alerts
      interval: 30s
      rules:
        # Alert: доступность ниже 99.5%
        - alert: LowAvailability
          expr: |
            (sum(rate(web23_http_requests_total{status!~"5.."}[5m]))
            / sum(rate(web23_http_requests_total[5m]))) * 100 < 99.6
          for: 5m
          labels:
            severity: critical
            variant: "23"
          annotations:
            summary: "Доступность ниже SLO 99.5%"
            description: >
              Текущая доступность {{ $value }}%
              (требуется ≥99.5%)

        # Alert: 5xx ошибок больше 1% за 5 минут
        - alert: HighErrorRate5xx
          expr: |
            (sum(rate(web23_http_requests_total{status=~"5.."}[5m]))
            / sum(rate(web23_http_requests_total[5m]))) * 100 > 1
          for: 5m
          labels:
            severity: warning
            variant: "23"
          annotations:
            summary: "Процент 5xx ошибок превышает 1%"
            description: >
              5xx ошибок: {{ $value }}% за последние 5 минут
              (порог >1%)

        # Alert: p95 latency превышает 200ms
        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95,
            sum(rate(web23_http_request_duration_seconds_bucket[5m]))
            by (le)) > 0.22
          for: 5m
          labels:
            severity: warning
            variant: "23"
          annotations:
            summary: "p95 latency превышает 200ms"
            description: >
              p95 latency: {{ $value }}s (требуется ≤0.2s)

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Node selector
nodeSelector: { }

# Tolerations
tolerations: [ ]

# Affinity
affinity: { }
