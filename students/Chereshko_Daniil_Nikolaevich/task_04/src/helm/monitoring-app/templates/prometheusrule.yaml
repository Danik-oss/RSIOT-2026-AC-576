apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "monitoring-app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: monitoring-app
    release: monitoring
    org.bstu.student.id: {{ .Values.student.id | quote }}
    org.bstu.student.group: {{ .Values.student.group | quote }}
    org.bstu.variant: {{ .Values.student.variant | quote }}
spec:
  groups:
    - name: monitoring-app-alerts
      interval: 30s
      rules:
        - alert: LowAvailability
          expr: |
            (sum(rate({{ .Values.metrics.prefix }}http_requests_total{status!~"5.."}[5m]))
            / sum(rate({{ .Values.metrics.prefix }}http_requests_total[5m]))) * 100 < {{ .Values.metrics.slo.availability }}
          for: 5m
          labels:
            severity: critical
            variant: {{ .Values.student.variant | quote }}
          annotations:
            summary: "Доступность ниже SLO"
            description: "Текущая доступность ниже требуемого SLO"
        - alert: HighErrorRate5xx
          expr: |
            (sum(rate({{ .Values.metrics.prefix }}http_requests_total{status=~"5.."}[5m]))
            / sum(rate({{ .Values.metrics.prefix }}http_requests_total[5m]))) * 100 > {{ .Values.metrics.slo.errorRate5xx }}
          for: 5m
          labels:
            severity: warning
            variant: {{ .Values.student.variant | quote }}
          annotations:
            summary: "Процент 5xx ошибок превышает порог"
            description: "Процент 5xx ошибок превышает заданный порог SLO"
        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95,
            sum(rate({{ .Values.metrics.prefix }}http_request_duration_seconds_bucket[5m]))
            by (le)) > {{ .Values.metrics.slo.latencyP95 }}
          for: 5m
          labels:
            severity: warning
            variant: {{ .Values.student.variant | quote }}
          annotations:
            summary: "p95 latency превышает порог"
            description: "p95 latency превышает требуемый порог SLO"
